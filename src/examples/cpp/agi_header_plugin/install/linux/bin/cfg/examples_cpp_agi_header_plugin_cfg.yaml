aimrt:
  plugin:
    plugins:
      - name: agi_header_plugin
        path: ./libaimrt_agi_header_plugin.so
  log:
    core_lvl: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
  executor:
    executors:
      - name: work_thread_pool
        type: asio_thread
        options:
          thread_num: 1
  channel:
    backends:
      - type: local
        options:
          subscriber_use_inline_executor: true
    pub_topics_options:
      - topic_name: "(.*)"
        enable_backends: [local]
        enable_filters: [agi_header_fill]
  module:
    modules:
      - name: AgiHeaderExampleModule
        log_lvl: INFO
      - name: AgiHeaderRos2ExampleModule
        log_lvl: INFO
