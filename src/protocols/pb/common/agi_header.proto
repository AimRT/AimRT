syntax = "proto3";

package aimrt.protocols.common;

message Time {
  int32 seconds = 1;
  uint32 fraction = 2;
}

message AgiHeader {
  uint32 seq_num = 1;
  string publisher_name = 2;
  Time publish_time = 3;
  Time generate_timestamp = 4;
  bytes extra_attr = 5;
}

message AgiRequestHeader {
  uint32 request_id = 1;
  string client_name = 2;
  Time request_time = 3;
  bytes extra_attr = 4;
}
